{% extends "amazoff/base.html" %}
{% load static %}
{% block title %}Amazoff - Login{% endblock %}
<!DOCTYPE html>
<html lang="en">
{% block remaining %}
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            {% if message %}
                <div class="auth-message">{{ message }}</div>
            {% endif %}

            <h2 class="auth-title">Login to Amazoff</h2>
            
            <form method="POST" class="auth-form" action="{% url 'login' %}">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn-action">Login</button>
            </form>

            <p class="auth-footer">
                Don't have an account? <a href="{% url 'register' %}" class="auth-link">Register here</a>
            </p>
        </div>
    </div>

</body>
{% endblock %}
</html>
