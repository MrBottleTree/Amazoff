{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Amazoff</title>

  <!-- Link to External CSS -->
  <link rel="stylesheet" href="{% static 'amazoff/styles.css' %}">

  <!-- FontAwesome for Icons -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

  <style>
    /* White background for standalone register page */
    body {
      background-color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
  </style>

  <script>
    function validatePasswords() {
      var password1 = document.getElementById("password1").value;
      var password2 = document.getElementById("password2").value;
      var errorMsg = document.getElementById("password-error");

      if (password1 !== password2) {
        errorMsg.textContent = "Passwords do not match!";
        return false; // Prevent form submission
      } else {
        errorMsg.textContent = ""; // Clear error if passwords match
        return true; // Allow form submission
      }
    }
  </script>
</head>
<body>

<!-- Large Register Message (Now Outside the Box) -->
<h2 class="login-heading">{{ message }}</h2>

<div class="login-container">
  <h2>Register</h2>

  <!-- Registration Form -->
  <form method="POST" action="{% url 'register' %}" onsubmit="return validatePasswords()">
    {% csrf_token %}

    <div class="input-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Choose a username" required>
    </div>

    <div class="input-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>
    </div>

    <div class="input-group">
      <label for="password1">Password</label>
      <input type="password" id="password1" name="password1" placeholder="Create a password" required>
    </div>

    <div class="input-group">
      <label for="password2">Confirm Password</label>
      <input type="password" id="password2" name="password2" placeholder="Confirm your password" required>
      <p id="password-error" style="color: red; font-size: 14px;"></p>
    </div>

    <button type="submit" class="login-btn">Register</button>
  </form>

  <!-- Login Link -->
  <p class="register-link">
    Already have an account? <a href="{% url 'login' %}">Login here</a>
  </p>
</div>

</body>
</html>
