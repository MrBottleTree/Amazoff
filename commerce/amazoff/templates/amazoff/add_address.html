{% extends "amazoff/layout.html" %}

{% block title %}Add Address{% endblock %}

{% block content %}
    <div class="add-address-container">
        <h2 class="page-title">Add a New Address</h2>

        <form method="POST" action="{% url 'addaddress' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="street">Street:</label>
                <input type="text" id="street" name="street" required>
            </div>
            <div class="form-group">
                <label for="city">City:</label>
                <input type="text" id="city" name="city" required>
            </div>
            <div class="form-group">
                <label for="state">State:</label>
                <input type="text" id="state" name="state" required>
            </div>
            <div class="form-group">
                <label for="zip_code">ZIP Code:</label>
                <input type="number" id="zip_code" name="zip_code" required>
            </div>
            <div class="form-group">
                <label for="country">Country:</label>
                <input type="text" id="country" name="country" required>
            </div>

            <button type="submit" class="btn-action">Save Address</button>
        </form>

        <a href="{% url 'dashboard' %}" class="btn-secondary">Cancel</a>
    </div>
{% endblock %}
