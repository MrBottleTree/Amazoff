{% extends "amazoff/layout.html" %}

{% block title %}Leave a Review{% endblock %}

{% block content %}
    <div class="review-container">
        <h2 class="page-title">Leave a Review</h2>

        <div class="review-product">
            <img src="{{ product.image.url }}" alt="{{ product.title }}">
            <h3>{{ product.title }}</h3>
        </div>

        <form method="POST" class="review-form" action = "{% url 'review' product.product_id %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="rating">Rating (1-5):</label>
                <select name="rating" id="rating" required>
                    <option value="" disabled selected>Select Rating</option>
                    <option value="1" {% if review and review.rating == 1 %}selected{% endif %}>1 - Poor</option>
                    <option value="2" {% if review and review.rating == 2 %}selected{% endif %}>2 - Fair</option>
                    <option value="3" {% if review and review.rating == 3 %}selected{% endif %}>3 - Good</option>
                    <option value="4" {% if review and review.rating == 4 %}selected{% endif %}>4 - Very Good</option>
                    <option value="5" {% if review and review.rating == 5 %}selected{% endif %}>5 - Excellent</option>
                </select>
            </div>

            <div class="form-group">
                <label for="comment">Comment:</label>
                <textarea name="comment" id="comment" rows="4" required>{{ review.comment|default_if_none:"" }}</textarea>
            </div>

            <button type="submit" class="btn-action">
                {% if review %}Update Review{% else %}Submit Review{% endif %}
            </button>
        </form>
    </div>
{% endblock %}
