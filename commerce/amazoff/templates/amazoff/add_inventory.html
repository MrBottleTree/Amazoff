{% extends "amazoff/layout.html" %}

{% block title %}Add Inventory{% endblock %}

{% block content %}
    <div class="inventory-container">
        <h2 class="page-title">Add Inventory</h2>

        {% if user_products %}
            <form method="POST" class="inventory-form" action = "{% url 'addinventory' %}">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="product">Select Product:</label>
                    <select id="product" name="product" required>
                        <option value="" disabled selected>-- Select Product --</option>
                        {% for prod in user_products %}
                            <option value="{{ prod.product_id }}">{{ prod.title }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="quantity">Quantity:</label>
                    <input type="number" id="quantity" name="quantity" min="1" required>
                </div>

                <div class="form-group">
                    <label for="address">Select Address:</label>
                    <select id="address" name="address" required>
                        <option value="" disabled selected>-- Select Address --</option>
                        {% for addr in user_addresses %}
                            <option value="{{ addr.address_id }}">{{ addr.street }}, {{ addr.city }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn-action">Add to Inventory</button>
            </form>
        {% else %}
            <p class="empty-text">You have no products listed.</p>
        {% endif %}
        <a href="{% url 'addproduct' %}" class="btn-action">Add Products</a>

    </div>
{% endblock %}
