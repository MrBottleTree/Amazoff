{% extends "amazoff/layout.html" %}

{% block title %}Add Product{% endblock %}

{% block content %}
    <div class="product-container">
        <h2 class="page-title">Add a New Product</h2>

        <form method="POST" enctype="multipart/form-data" action="{% url 'addproduct' %}" onsubmit="return validateForm()">
            {% csrf_token %}

            <div class="form-group">
                <label for="title">Product Title:</label>
                <input type="text" id="title" name="title" required>
            </div>

            <div class="form-group">
                <label for="description">Description:</label>
                <textarea id="description" name="description" rows="4" required></textarea>
            </div>

            <div class="form-group">
                <label for="price">Price (₹):</label>
                <input type="number" id="price" name="price" min="1" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="category">Select Category:</label>
                <select id="category" name="category" required>
                    <option value="" disabled selected>-- Select Category --</option>
                    {% for cat in categories %}
                        <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="company">Select Company:</label>
                <select id="company" name="company" required>
                    <option value="" disabled selected>-- Select Company --</option>
                    {% for comp in companies %}
                        <option value="{{ comp.company_id }}">{{ comp.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="image">Product Image:</label>
                <input type="file" id="image" name="image" accept="image/*" required>
            </div>

            <button type="submit" class="btn-action">Add Product</button>
        </form>
    </div>

    <script>
        function validateForm() {
            const title = document.getElementById("title").value.trim();
            const description = document.getElementById("description").value.trim();
            const price = document.getElementById("price").value.trim();
            const company = document.getElementById("company").value;
            const image = document.getElementById("image").files.length;

            if (!title || !description || !price || !company || image === 0) {
                alert("All fields are required.");
                return false;
            }
            return true;
        }
    </script>
{% endblock %}
